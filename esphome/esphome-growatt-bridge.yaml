# growatt-bridge-c3
# Version 1.7
# 1.0 Initial version
# 1.1 Added "Volt Watt mode": An algorith that automatically lowers active power output when local grid voltage gets too high.
# 1.2 Volt Watt mode now uses a linear voltage-to-rate ramp (quantized to 10% steps) between the low/high voltage
#     thresholds, instead of pure hysteresis: below Voltage Low Threshold the rate target is always 100%, above
#     Voltage High Threshold it's Voltage Control Min Rate, and in between it ramps linearly. The rate is moved
#     toward that target in steps of 10 percentage points per 1s cycle.
# 1.3 The rate step size is no longer a fixed 10%. It's now derived from the AC_Voltage sensor's 0.1V resolution:
#     the number of 0.1V increments between Voltage Low Threshold and Voltage High Threshold is used to divide the
#     (100% - Voltage Control Min Rate) rate range, so each 0.1V change in measured voltage corresponds to one rate
#     step. Both the target quantization and the per-cycle movement step use this derived value.
# 1.4 Fixed a bug where Active Power Rate would not always recover back to 100% after voltage dropped
#     below Voltage Low Threshold. The modbus_controller only reads register 3 back on its own ~2s poll
#     cycle, so right after the loop wrote a new rate itself, the sensor's state could still show the old
#     value for a cycle or two - the loop mistook that stale readback for an external change (Victron/HA/
#     web UI) and permanently clamped the recovery ceiling too low. Added a short grace period (skipping
#     external-change detection for ~3s) after every local write, and the loop now steps from its own
#     tracked last-written value instead of the possibly-stale sensor reading.
# 1.5 The fixed 3s grace period from 1.4 still wasn't always long enough: modbus_pv polls ~20 registers
#     at one command per second, so a full round trip back to register 3 can take much longer than 3s,
#     and the recovery-to-100% bug could still occur. Replaced the fixed grace period with confirmation-
#     based detection: after a local write, external-change detection stays paused until the readback has
#     actually been observed to match what was written, however long that takes, instead of a guessed
#     timeout. Also logs a message when a genuine external change is detected, to help verify behaviour.
# 1.6 Added three diagnostic entities to the "Volt Watt mode" web page section so the loop's internal
#     state can be observed directly instead of inferred: "Victron Setpoint (ceiling)" (the local ceiling
#     the loop is currently respecting), "Last Local Write" (the value the loop itself last wrote), and
#     "Local Write Status" (whether the loop is still waiting for a write to be confirmed by the modbus
#     readback, or has confirmed it). Useful for pinpointing whether "ceiling" is genuinely being set by
#     an external write, or something else is preventing recovery to 100%.
# 1.7 Diagnostics in 1.6 showed the ceiling was working exactly as designed: Victron (via SunSpec dynamic
#     power reduction writing to target_power_limit) had genuinely set the Active Power Rate to below
#     100%, and since Victron never refreshed that value, local voltage-based recovery stayed capped at
#     it indefinitely, even once voltage was well within safe range. Added a 1-minute expiry: if Victron
#     (or HA/web UI) hasn't refreshed its setpoint within VICTRON_CEILING_TIMEOUT_MS (60000ms) of it last
#     changing, the ceiling is released back to 100% so local voltage control can recover fully on its
#     own. Added a "Victron Ceiling Age" sensor (seconds since the ceiling was last refreshed) to the web
#     page to make this visible, and a log line when the ceiling expires.
#
#
#
# ESPhome bridge based on an ESP32-C3 to control a single phase Growatt inverter (MIC or MID TL-X type via MODbus by Home Assistant. The bride exposed a web-site and publish values to i.e. Victron by Sunspec.
# Also Victron dynamic power reduction is supported. Check Settings => Integrations => PV_inverters => Select your device => Enable Dynamic power reduction
# It is also possible to reduce the power by RRCR (Radio Ripple Control Receiver) / DRM (Demand Response Mode). However this is not enabled on most Growatt inverters. 
# It should be possible to anable RRCD/DRM via ShineTools app or the inverter's local settings.
#
# A special thanks to following repositories and information to create this file
# https://github.com/JasperE84/Growatt_ESPHome_ESP32_Modbus_RS485_Example
# https://github.com/mahoekst/SunspecModbusServer/tree/main
# https://gathering.tweakers.net/forum/list_messages/2153412


substitutions:
  device_name: growatt-bridge-c3
  friendly_name: Growatt Bridge c3
  manufacturer: "Growatt"
  model: "MIC 3000TL-X"
  serial: "QUH8CKT07Q"
  partnumber: "PV00.0038500"
  max_power: "3000"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -200  # After WiFi and modbus are up
    then:
      # Publish 0 for all measurement sensors so they show 0 instead of NA
      # when the inverter is off (e.g. after a night reboot). Totals are left
      # as NA since 0 would be misleading.
      # Power rate is initialised to 100% — register 3 is unreliable when the
      # inverter is off. Victron will write the correct value when it connects.
      - lambda: |-
          id(DC1_Voltage).publish_state(0);
          id(DC1_Current).publish_state(0);
          id(DC1_Power).publish_state(0);
          id(AC_Voltage).publish_state(0);
          id(AC_active_Power).publish_state(0);
          id(AC_Frequency).publish_state(0);
          id(Heatsink_temperature).publish_state(0);
          id(Active_Power_Rate).publish_state(100);
      - select.set:
          id: rrcr_power_level
          option: "100%"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino


# Enable logging
logger:
  level: INFO
  logs:
    modbus_controller: ERROR # Prevent [modbus_controller:063] Received modbus data but command queue is empty messages showing all the time
    modbus: ERROR # Prevent [modbus:064] Stop waiting for response from 1 messages when inverter is off
    #sunspec_modbus_server: DEBUG  #if you want to see the raw SunSpec Modbus TCP communication for debugging

# Enable Home Assistant API
api:
  reboot_timeout: 60min
  encryption:
    key: !secret esphome_api_key

ota:
  - platform: esphome
    password: !secret esphome_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.33
    gateway: 192.168.1.1
    subnet: 255.255.255.0   

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Growatt-Bridge-C3"
    password: !secret esphome_ap_password

time:
  - platform: homeassistant
    
captive_portal:

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: group_ac
      name: "AC Output"
      sorting_weight: 1
    - id: group_dc
      name: "DC Input (PV)"
      sorting_weight: 2
    - id: volt_watt_mode
      name: "Volt Watt mode"
      sorting_weight: 3
    - id: group_control
      name: "Control"
      sorting_weight: 4
    - id: group_device
      name: "Device"
      sorting_weight: 5

# Define the pins as outputs
output:
  - platform: gpio
    id: led_red_output
    pin: 
      number: GPIO8
      inverted: true
  - platform: gpio
    id: led_green_output
    pin: 
      number: GPIO5
      inverted: true
      
switch:
  - platform: gpio
    id: relay_k1_0pct
    pin: 
      number: GPIO6
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_k2_30pct
    pin: 
      number: GPIO3
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_k3_60pct
    pin: 
      number: GPIO9
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_k4_100pct
    pin: 
      number: GPIO10
      inverted: true
    restore_mode: ALWAYS_ON

  # Enables/disables the automatic voltage-based power control
  # (see the voltage_power_control interval below). Default ON.
  - platform: template
    name: "Volt Watt mode On - Off"
    id: volt_watt_mode_enable
    web_server:
      sorting_group_id: volt_watt_mode
      sorting_weight: 4
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    icon: mdi:sine-wave

  # Growatt r/w setting writers
  - platform: modbus_controller
    modbus_controller_id: modbus_pv
    name: "Inverter On - Off"
    id: "Inverter_On_Off"
    web_server:
      sorting_group_id: group_control
      sorting_weight: 1
    register_type: holding
    address: 0
    bitmask: 1 # Assuming 1 is ON, 0 is OFF
    entity_category: config
    icon: mdi:toggle-switch

light:
  - platform: binary
    name: "Red LED"
    output: led_red_output
    id: led_red
    internal: true
  - platform: binary
    name: "Green LED"
    output: led_green_output
    id: led_green
    internal: true

# UART for RS485 communication with inverter
uart:
  - id: uart_pv
    rx_pin: GPIO20  # RX D6 = GPIO09
    tx_pin: GPIO21  # TX D7 = GPIO10
    baud_rate: 9600
    stop_bits: 1
    parity: NONE


# Modbus RTU client (used by growatt_solar)
modbus:
  - uart_id: uart_pv
    flow_control_pin: GPIO07  #D5
    id: modbus_client
    send_wait_time: 1000ms

# Modbus controller for Growatt inverter (write-only, for power control)
modbus_controller:
  - id: modbus_pv
    address: 0x1   ## address of the Modbus slave device on the bus
    modbus_id: modbus_client
    setup_priority: -10
    update_interval: 2s
    command_throttle: 1000ms

# External component from GitHub
external_components:
  - source:
      type: local
      path: components
    components: [ sunspec_modbus_server ]


number:
  - platform: modbus_controller
    modbus_controller_id: modbus_pv
    name: "Active Power Rate"
    id: "Active_Power_Rate"
    web_server:
      sorting_group_id: group_control
      sorting_weight: 2
    register_type: holding
    address: 3
    value_type: U_WORD
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    multiply: 1 
    entity_category: config
    icon: mdi:gauge
    mode: SLIDER
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x >= 100;'
            then:
              - script.stop: blink_led
              - light.turn_on: led_green
            else:
              - script.execute: blink_led

  # Settings for the automatic voltage-based power control (see the
  # voltage_power_control interval below).
  - platform: template
    name: "Voltage High Threshold"
    id: voltage_high_threshold
    web_server:
      sorting_group_id: volt_watt_mode
      sorting_weight: 1
    optimistic: true
    restore_value: true
    initial_value: 251
    min_value: 250
    max_value: 253
    step: 1
    unit_of_measurement: "V"
    entity_category: config
    icon: mdi:flash-alert
    mode: SLIDER

  - platform: template
    name: "Voltage Low Threshold"
    id: voltage_low_threshold
    web_server:
      sorting_group_id: volt_watt_mode
      sorting_weight: 2
    optimistic: true
    restore_value: true
    initial_value: 250
    min_value: 249
    max_value: 252
    step: 1
    unit_of_measurement: "V"
    entity_category: config
    icon: mdi:flash-alert-outline
    mode: SLIDER

  - platform: template
    name: "Voltage Control Min Rate"
    id: voltage_control_min_rate
    web_server:
      sorting_group_id: volt_watt_mode
      sorting_weight: 3
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 0
    max_value: 60
    step: 10
    unit_of_measurement: "%"
    entity_category: config
    icon: mdi:gauge-low
    mode: SLIDER

script:
  - id: blink_led
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(Active_Power_Rate).state < 100;'
          then:
            - light.turn_on: led_green
            - delay: !lambda |-
                float x = id(Active_Power_Rate).state;
                // fast (~100ms) near 99, slow (~1000ms) near 0
                return (int) (1000 - (x / 100.0) * 900);
            - light.turn_off: led_green
            - delay: !lambda |-
                float x = id(Active_Power_Rate).state;
                return (int) (1000 - (x / 100.0) * 900);
    
# Voltage-based Active Power Rate control.
# Every 5s: if AC voltage is too high, step Active Power Rate down (curtail);
# if it's back within range, step it back up. Clamped to [30, 100]%.
# Adjust the two thresholds and step sizes below to tune the behaviour.
# Tracks the "ceiling" the local voltage control must respect.
# victron_setpoint: the last value Active_Power_Rate was set to by something
#   other than our own local control (Victron/SunSpec, Home Assistant, the
#   web UI, etc). Local control is only ever allowed to curtail *below* this.
# last_local_write: the value we ourselves last wrote, so we can tell our
#   own writes apart from external ones.
# awaiting_local_confirmation: true from the moment we write until we've
#   actually seen the modbus readback match that write. While true, we don't
#   trust id(Active_Power_Rate).state for external-change detection, since
#   modbus_pv polls ~20 registers at 1 command/s, so a full round trip back
#   to register 3 can take far longer than a fixed couple of seconds.
# victron_setpoint_last_update: millis() timestamp of the last time an
#   external change was detected. If Victron doesn't refresh its setpoint
#   within VICTRON_CEILING_TIMEOUT_MS, the ceiling expires back to 100% so
#   local voltage-based recovery isn't blocked forever by a stale request.
# victron_ceiling_active: whether victron_setpoint currently reflects a
#   real external request (vs. still being the untouched initial value).
globals:
  - id: victron_setpoint
    type: float
    restore_value: no
    initial_value: '100.0'
  - id: last_local_write
    type: float
    restore_value: no
    initial_value: '100.0'
  - id: awaiting_local_confirmation
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: victron_setpoint_last_update
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: victron_ceiling_active
    type: bool
    restore_value: no
    initial_value: 'false'

interval:
  - id: voltage_power_control
    interval: 1s
    then:
      - lambda: |-
          // Master on/off switch for this feature
          if (!id(volt_watt_mode_enable).state) {
            return;
          }

          const float MAX_RATE = 100.0;                 // absolute upper bound
          const float VOLTAGE_RESOLUTION = 0.1;          // AC_Voltage sensor resolution (V)

          float voltage = id(AC_Voltage).state;
          float sensor_rate = id(Active_Power_Rate).state;
          float VOLTAGE_HIGH_THRESHOLD = id(voltage_high_threshold).state;
          float VOLTAGE_LOW_THRESHOLD  = id(voltage_low_threshold).state;
          float MIN_RATE = id(voltage_control_min_rate).state;

          // Skip if any value isn't valid yet (e.g. inverter offline at boot)
          if (std::isnan(voltage) || std::isnan(sensor_rate) ||
              std::isnan(VOLTAGE_HIGH_THRESHOLD) || std::isnan(VOLTAGE_LOW_THRESHOLD) ||
              std::isnan(MIN_RATE)) {
            return;
          }

          // Don't trust the sensor for external-change detection until we've
          // actually seen it confirm our last write. This avoids guessing a
          // fixed timeout for how long the modbus readback takes (it shares
          // the bus with ~20 other registers, so that can vary a lot).
          if (id(awaiting_local_confirmation)) {
            if (std::abs(sensor_rate - id(last_local_write)) <= 0.01f) {
              // Readback caught up with our last write - safe to resume
              // watching for genuine external changes.
              id(awaiting_local_confirmation) = false;
            }
            // Still stale (or coincidentally equal, either way nothing to do)
          } else if (std::abs(sensor_rate - id(last_local_write)) > 0.01f) {
            // We already had a confirmed match at some point, and now the
            // value differs from what we last wrote - so something external
            // (Victron/SunSpec, HA, web UI) changed it. Treat that as the
            // new ceiling for local curtailment.
            ESP_LOGI("volt_watt", "External Active Power Rate change detected: %.1f%% -> %.1f%%, ceiling updated", id(last_local_write), sensor_rate);
            id(victron_setpoint) = sensor_rate;
            id(last_local_write) = sensor_rate;
            id(victron_setpoint_last_update) = millis();
            id(victron_ceiling_active) = true;
          }

          // If Victron (or HA/web UI) hasn't refreshed its setpoint within
          // this window, stop treating it as a binding ceiling and let
          // voltage control recover to 100% on its own. Change this to
          // adjust how long a Victron request stays in force without being
          // refreshed.
          const uint32_t VICTRON_CEILING_TIMEOUT_MS = 60000; // 1 minute
          if (id(victron_ceiling_active) &&
              (millis() - id(victron_setpoint_last_update) > VICTRON_CEILING_TIMEOUT_MS)) {
            ESP_LOGI("volt_watt", "Victron ceiling (%.1f%%) expired after %us with no refresh - releasing to 100%%",
                     id(victron_setpoint), (unsigned)((millis() - id(victron_setpoint_last_update)) / 1000));
            id(victron_setpoint) = MAX_RATE;
            id(victron_ceiling_active) = false;
          }

          // Use our own tracked value as "current_rate" for stepping, so a
          // still-stale sensor reading right after our own write can't
          // throw off the ramp calculation.
          float current_rate = id(last_local_write);

          float ceiling = id(victron_setpoint);
          if (ceiling > MAX_RATE) ceiling = MAX_RATE;
          if (ceiling < MIN_RATE) ceiling = MIN_RATE;

          // How many distinct 0.1V steps fit between the two thresholds. The
          // rate step size is derived from this, so each 0.1V change in the
          // measured AC voltage corresponds to (at most) one rate step -
          // matching the resolution of the AC_Voltage sensor itself.
          float span = VOLTAGE_HIGH_THRESHOLD - VOLTAGE_LOW_THRESHOLD;
          float num_voltage_steps = (span > 0) ? round(span / VOLTAGE_RESOLUTION) : 0;
          float RATE_STEP = (num_voltage_steps > 0) ? (MAX_RATE - MIN_RATE) / num_voltage_steps : (MAX_RATE - MIN_RATE);
          if (RATE_STEP <= 0) RATE_STEP = 1.0; // safety fallback, avoids div-by-zero style issues

          // Work out the target rate for the current voltage:
          //  - at/below VOLTAGE_LOW_THRESHOLD  -> 100%
          //  - at/above VOLTAGE_HIGH_THRESHOLD -> MIN_RATE
          //  - in between                      -> linear ramp, quantized to RATE_STEP
          float target_rate;
          if (voltage <= VOLTAGE_LOW_THRESHOLD) {
            target_rate = MAX_RATE;
          } else if (voltage >= VOLTAGE_HIGH_THRESHOLD) {
            target_rate = MIN_RATE;
          } else if (span > 0) {
            float frac = (voltage - VOLTAGE_LOW_THRESHOLD) / span; // 0..1, 0=low, 1=high
            target_rate = MAX_RATE - frac * (MAX_RATE - MIN_RATE);
            target_rate = round(target_rate / RATE_STEP) * RATE_STEP; // quantize to one rate step per 0.1V
          } else {
            target_rate = MIN_RATE;
          }
          if (target_rate < MIN_RATE) target_rate = MIN_RATE;
          if (target_rate > MAX_RATE) target_rate = MAX_RATE;

          // Move current_rate toward target_rate by at most one RATE_STEP per
          // cycle, never overshooting the target.
          float new_rate = current_rate;
          if (target_rate > current_rate) {
            new_rate = current_rate + RATE_STEP;
            if (new_rate > target_rate) new_rate = target_rate;
          } else if (target_rate < current_rate) {
            new_rate = current_rate - RATE_STEP;
            if (new_rate < target_rate) new_rate = target_rate;
          }

          if (new_rate < MIN_RATE) new_rate = MIN_RATE;
          // Local control may curtail freely, but must never raise the rate
          // above whatever Victron (or HA/manual) last requested.
          if (new_rate > ceiling) new_rate = ceiling;

          if (std::abs(new_rate - current_rate) > 0.01f) {
            auto call = id(Active_Power_Rate).make_call();
            call.set_value(new_rate);
            call.perform();
            id(last_local_write) = new_rate;
            id(awaiting_local_confirmation) = true;
          }

select:
  - platform: template
    name: "RRCR Power level"
    id: rrcr_power_level
    web_server:
      sorting_group_id: group_control
      sorting_weight: 3
    optimistic: true
    options:
      - "0%"
      - "30%"
      - "60%"
      - "100%"
    restore_value: true
    initial_option: "100%"
    icon: mdi:gauge
    set_action:
      then:
        - lambda: |-
            // make sure only one relay is ever closed at a time
            id(relay_k1_0pct).turn_off();
            id(relay_k2_30pct).turn_off();
            id(relay_k3_60pct).turn_off();
            id(relay_k4_100pct).turn_off();

            if (x == "0%") {
              id(relay_k1_0pct).turn_on();
            } else if (x == "30%") {
              id(relay_k2_30pct).turn_on();
            } else if (x == "60%") {
              id(relay_k3_60pct).turn_on();
            } else if (x == "100%") {
              id(relay_k4_100pct).turn_on();
            }

            id(rrcr_power_level).publish_state(x);
    

# Growatt read-only sensors with home assistant config
sensor:
  # Debug/diagnostic sensors for the voltage-based power control loop.
  # Watch these on the web page (or in HA) to see exactly what the loop
  # thinks is going on - in particular, whether "Victron Setpoint (ceiling)"
  # ever gets stuck below 100% when it shouldn't be.
  - platform: template
    name: "Victron Setpoint (ceiling)"
    id: victron_setpoint_sensor
    web_server:
      sorting_group_id: volt_watt_mode
      sorting_weight: 5
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: mdi:target
    update_interval: 1s
    lambda: |-
      return id(victron_setpoint);

  - platform: template
    name: "Last Local Write"
    id: last_local_write_sensor
    web_server:
      sorting_group_id: volt_watt_mode
      sorting_weight: 6
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: mdi:pencil
    update_interval: 1s
    lambda: |-
      return id(last_local_write);

  # Seconds since Victron (or HA/web UI) last actually changed the Active
  # Power Rate register. Once this passes 60s, the ceiling above expires
  # back to 100% and local voltage-based recovery is no longer capped by it.
  # Shows "unknown" if no external write has been seen since boot.
  - platform: template
    name: "Victron Ceiling Age"
    id: victron_setpoint_age_sensor
    web_server:
      sorting_group_id: volt_watt_mode
      sorting_weight: 8
    unit_of_measurement: "s"
    accuracy_decimals: 0
    icon: mdi:timer-sand
    update_interval: 1s
    lambda: |-
      if (!id(victron_ceiling_active)) {
        return NAN;
      }
      return (millis() - id(victron_setpoint_last_update)) / 1000.0f;

  - platform: modbus_controller
    modbus_controller_id: modbus_pv
    name: "AC Active Power"
    id: AC_active_Power
    web_server:
      sorting_group_id: group_ac
      sorting_weight: 1  
    address: 35 # Pac H (start van 32-bit waarde)
    register_count: 2
    register_type: "read"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:power-plug
    value_type: U_DWORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_pv
    name: "AC Voltage"
    id: AC_Voltage
    web_server:
      sorting_group_id: group_ac
      sorting_weight: 2
    address: 38  # Vac1
    register_type: "read"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    icon: mdi:sine-wave
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_pv
    name: "AC Frequency"
    id: AC_Frequency
    web_server:
      sorting_group_id: group_ac
      sorting_weight: 3 
    address: 37  # Fac
    register_type: "read"
    unit_of_measurement: Hz
    device_class: frequency
    state_class: measurement
    icon: mdi:waveform
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
