# SunSpec Modbus TCP Server - exposes solar inverter data to Victron
sunspec_modbus_server:
  id: sunspec
  port: 502
  unit_id: 126
  manufacturer: ${manufacturer}
  model: ${model}
  serial: ${serial}
  version: ${partnumber}
  max_power: ${max_power}
  update_interval: 1s

  # Source sensors from solar inverter
  source_ac_power: AC_active_Power
  #source_ac_power: AC_reactive_Power
  source_voltage: AC_Voltage
  source_frequency: AC_Frequency
  source_total_energy: Total_Production
  source_dc_voltage: DC1_Voltage
  source_dc_current: DC1_Current
  source_dc_power: DC1_Power
  source_temperature: Heatsink_temperature
  #source_inverter_status: inverter_state
  target_power_limit: Active_Power_Rate
    

text_sensor:
  # Whether the voltage-control loop is currently waiting to see its last
  # write reflected back from the inverter before trusting the sensor for
  # external-change detection again. If this is stuck on "Waiting..." for
  # a long time, the modbus readback for Active Power Rate isn't updating
  # at all - worth checking the modbus/modbus_controller logs for errors.
  - platform: template
    name: "Local Write Status"
    id: local_write_status
    web_server:
      sorting_group_id: volt_watt_mode
      sorting_weight: 7
    icon: mdi:sync
    update_interval: 1s
    lambda: |-
      return id(awaiting_local_confirmation) ? std::string("Waiting for readback...") : std::string("Confirmed");

  # Firmware version - Holding registers 9-11 (3 x 16-bit regs = 6 ASCII chars)
  - platform: modbus_controller
    modbus_controller_id: modbus_pv
    name: "Firmware version"
    id: "firmware_version"
    web_server:
      sorting_group_id: group_device
    register_type: holding
    address: 9
    register_count: 3
    response_size: 6
    raw_encode: ANSI

  - platform: modbus_controller
    modbus_controller_id: modbus_pv
    name: "Control Firmware version"
    id: "control_firmware_version"
    web_server:
      sorting_group_id: group_device
    register_type: holding
    address: 12
    register_count: 3
    response_size: 6
    raw_encode: ANSI

  - platform: modbus_controller
    modbus_controller_id: modbus_pv
    name: "Serial Number"
    id: "serial_number"
    web_server:
      sorting_group_id: group_device
    register_type: holding
    address: 209
    register_count: 15
    response_size: 30
    raw_encode: ANSI

  - platform: modbus_controller
    modbus_controller_id: modbus_pv
    name: "Product type"
    id: "Product_type"
    web_server:
      sorting_group_id: group_device
    register_type: holding
    address: 34
    register_count: 8
    response_size: 16
    raw_encode: ANSI
  
  - platform: modbus_controller
    modbus_controller_id: modbus_pv
    name: "Inverter Status"
    id: inverter_state
    web_server:
      sorting_group_id: group_device
      sorting_weight: 5
    icon: mdi:information
    address: 0
    register_type: "read"
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t value = modbus::helpers::word_from_hex_str(x, 0);
      switch (value) {
        case 0: return std::string("Waiting");
        case 1: return std::string("Normal");
        case 3: return std::string("Fault");
        default: return std::string("Unknown");
      }
    on_value:
      then:
        - if:
            condition:
              text_sensor.state:
                id: inverter_state
                state: "Normal"
            then:
              - light.turn_on: led_green
              - light.turn_off: led_red
            else:
              - light.turn_off: led_green
              - light.turn_on: led_red

  - platform: template
    name: "${friendly_name} Build Time"
    lambda: return {__DATE__ " " __TIME__};
    update_interval: 1h
    entity_category: diagnostic
    icon: mdi:clock-outline
    web_server:
      sorting_group_id: group_device
      sorting_weight: 5

  - platform: template
    name: "Manufacturer"
    web_server:
      sorting_group_id: group_device
      sorting_weight: 1
    lambda: |-
      return {"${manufacturer}"};
  - platform: template
    name: "Model"
    web_server:
      sorting_group_id: group_device
      sorting_weight: 2
    lambda: |-
      return {"${model}"};
  - platform: template
    name: "Serial nummer"
    web_server:
      sorting_group_id: group_device
      sorting_weight: 3
    lambda: |-
      return {"${serial}"};
  - platform: template
    name: "partnumber"
    web_server:
      sorting_group_id: group_device
      sorting_weight: 4
    lambda: |-
      return {"${partnumber}"};
  - platform: template
    name: "Max power"
    web_server:
      sorting_group_id: group_device
      sorting_weight: 4
    lambda: |-
      return {"${max_power} Watt"};


button:
  - platform: restart
    name: "${friendly_name} Restart"
    web_server:
      sorting_group_id: group_device
      sorting_weight: 9
